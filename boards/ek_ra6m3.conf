CONFIG_LV_USE_DRAW_DAVE2D=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_DRAW_LAYER_SIMPLE_BUF_SIZE=32768
CONFIG_LV_ATTRIBUTE_MEM_ALIGN_SIZE=64
CONFIG_DMA=y

# RA6M3: SDRAM bus pins (P101-P107, P111-P115, P301-P303, P608-P610) overlap
# with GLCDC LCD_DATA pins. SDRAM and GLCDC cannot be active simultaneously.
# Frame buffer and LVGL VDB stay in internal SRAM (640KB total).
#
# Memory budget: 1×255 KB (FB) + 2×26 KB (VDB) + ~101 KB (other) ≈ 408 KB
#   (frees ≈ 215 KB vs the previous FB_NUM=0 double-VDB setup).
#
# FB_NUM=1: one 255 KB driver-managed framebuffer that GLCDC always reads from.
#   Enables partial writes so LVGL can update individual dirty regions without
#   redrawing the full screen.  No vsync buffer-swap in steady state; the GLCDC
#   reads fb_background in-place while the flush thread writes to it — possible
#   tearing on large rapid updates, acceptable for mostly-static UIs.
# FULL_REFRESH=n + VDB_SIZE=10: LVGL only redraws dirty regions (at most ~27
#   rows per strip).  Each strip is blitted to the framebuffer via
#   display_write().  VDB_SIZE strictly < 100 ensures every write is partial
#   (height < 272) so the full-screen branch in the driver is never taken, the
#   GLCDC framebuffer pointer never changes, and fb_background stays live.
# DOUBLE_VDB: two small VDBs let the flush thread blit one strip while LVGL
#   renders the next in parallel.
# VDB_ALIGN=64: LVGL draw operations may use DMA; 64-byte source alignment is
#   required.  Note: fb_background is only __aligned(8) in the driver — if the
#   linker does not place it at a 64-byte boundary the image will shift
#   horizontally by (fb_background % 64) / 2 pixels.  Verify with:
#     nm -S build/zephyr/zephyr.elf | grep fb_background
CONFIG_RENESAS_RA_GLCDC_FB_NUM=1
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_FULL_REFRESH=n
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_VDB_ALIGN=64

# Enable real CPU-load measurement so lv_os_get_idle_percent() returns actual
# idle% instead of always 0.  Without this, the LVGL sysmon calls
# lv_os_get_idle_percent() which unconditionally returns 0 → CPU always 100%.
# CPU_LOAD selects TRACING, resolved to the null backend (tracing_none.c):
# it times idle-thread entry/exit via k_cycle_get_32() — negligible overhead.
CONFIG_CPU_LOAD=y

# Debug console via J-Link RTT (Segger module required).
# Remove or set UART_CONSOLE=y / RTT_CONSOLE=n to switch back to UART.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
