#
# Extra configuration for the CI screenshot test on native_sim:
#   west build -b native_sim/native/64 -- -DEXTRA_CONF_FILE=tests/screenshot.conf

CONFIG_APP_SCREENSHOT=y
CONFIG_APP_INTRO_DURATION_MS=500

# Full-frame render mode: the entire display is always rendered into a single
# buffer, which lets lv_test_screenshot_compare() read back the complete frame
# via lv_display_get_buf_active().
CONFIG_LV_Z_FULL_REFRESH=y

# LVGL test framework — provides lv_test_screenshot_compare() and LodePNG.
CONFIG_LV_USE_TEST=y
CONFIG_LV_USE_TEST_SCREENSHOT_COMPARE=y
CONFIG_LV_USE_LODEPNG=y

# LodePNG calls lv_fs_open() (LVGL's FS API) instead of fopen(). Enable the
# POSIX FS driver so it can read/write PNG files on the host filesystem.
# Letter 'A' (65) is the driver; the default routes bare paths to it.
CONFIG_LV_USE_FS_POSIX=y
CONFIG_LV_FS_POSIX_LETTER=65
CONFIG_LV_FS_DEFAULT_DRIVER_LETTER=65

# The comparison allocates two full-frame XRGB8888 scratch buffers
# (480x272x4 ≈ 512 KB each) from the LVGL pool via lv_malloc().
CONFIG_LV_Z_MEM_POOL_SIZE=4194304

# Disable the FPS/CPU overlay: its text changes between runs and would make
# the image comparison flaky.
CONFIG_LV_USE_PERF_MONITOR=n
CONFIG_LV_USE_SYSMON=n
