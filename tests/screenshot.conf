#
# Extra configuration for the CI screenshot test on native_sim:
#   west build -b native_sim/native/64 -- -DEXTRA_CONF_FILE=tests/screenshot.conf

CONFIG_APP_SCREENSHOT=y
CONFIG_LV_USE_SNAPSHOT=y

# The snapshot buffer (480x272 RGB888 ~ 0.4 MB) is allocated from the LVGL
# memory pool, so it needs to be larger than the default.
CONFIG_LV_Z_MEM_POOL_SIZE=2097152

# Disable the FPS/CPU overlay: its text changes between runs and would make
# the image comparison flaky.
CONFIG_LV_USE_PERF_MONITOR=n
CONFIG_LV_USE_SYSMON=n
